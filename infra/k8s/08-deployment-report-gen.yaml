apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-gen
  namespace: musclequant
  labels: { app: musclequant, component: report-gen }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: musclequant, component: report-gen }
  template:
    metadata:
      labels: { app: musclequant, component: report-gen }
    spec:
      # report-gen is stateless and doesn't need IRSA — use the namespace default SA.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: report-gen
          image: ${ECR_REPORT_REPO}:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
