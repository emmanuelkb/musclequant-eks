apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: musclequant
  labels: { app: musclequant, component: api }
spec:
  type: ClusterIP
  selector: { app: musclequant, component: api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: report-gen
  namespace: musclequant
  labels: { app: musclequant, component: report-gen }
spec:
  type: ClusterIP
  selector: { app: musclequant, component: report-gen }
  ports:
    - name: http
      port: 8081
      targetPort: 8081
