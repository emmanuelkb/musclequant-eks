apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: musclequant-tls
  namespace: musclequant
spec:
  secretName: musclequant-tls
  duration: 2160h
  renewBefore: 360h
  commonName: musclequant.local
  dnsNames:
    - musclequant.local
    - "*.musclequant.local"
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
